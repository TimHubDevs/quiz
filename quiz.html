<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Контрольні роботи · 9 клас</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0f0f1a;--card:#1a1a2e;--accent:#7c5cfc;--a2:#a78bfa;--green:#10b981;--red:#ef4444;--yellow:#f59e0b;--cyan:#22d3ee;--text:#f1f5f9;--muted:#94a3b8;--bdr:rgba(124,92,252,.2);--r:20px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;font-family:'Manrope',sans-serif;background:var(--bg);color:var(--text);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body::before{content:'';position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 80% 60% at 20% 10%,rgba(124,92,252,.18) 0%,transparent 60%),radial-gradient(ellipse 60% 50% at 80% 90%,rgba(16,185,129,.1) 0%,transparent 60%);pointer-events:none}
#app{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px 14px}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:28px 22px;width:100%;max-width:560px;box-shadow:0 24px 64px rgba(0,0,0,.5);animation:su .4s cubic-bezier(.16,1,.3,1) both}
@keyframes su{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.badge{display:inline-flex;align-items:center;background:rgba(124,92,252,.15);border:1px solid rgba(124,92,252,.3);color:var(--a2);border-radius:100px;padding:4px 13px;font-family:'Unbounded',sans-serif;font-size:10px;letter-spacing:.04em;margin-bottom:11px}
h1{font-family:'Unbounded',sans-serif;font-size:clamp(20px,5vw,28px);font-weight:900;line-height:1.1;margin-bottom:4px;background:linear-gradient(135deg,#fff 30%,var(--a2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
h2{font-family:'Unbounded',sans-serif;font-size:clamp(15px,4vw,20px);font-weight:700;margin-bottom:5px}
.sub{color:var(--muted);font-size:13px;margin-bottom:16px}

/* ── Вибір тесту ── */
.test-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.test-card{background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.08);border-radius:16px;padding:18px 14px;cursor:pointer;text-align:center;transition:all .2s;font-family:'Manrope',sans-serif;color:var(--text)}
.test-card:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.4)}
.test-card.geo:hover,.test-card.geo:focus{border-color:var(--accent);background:rgba(124,92,252,.12)}
.test-card.alg:hover,.test-card.alg:focus{border-color:var(--green);background:rgba(16,185,129,.1)}
.tc-icon{font-size:32px;margin-bottom:8px}
.tc-title{font-family:'Unbounded',sans-serif;font-size:13px;font-weight:700;margin-bottom:4px}
.tc-sub{font-size:10px;color:var(--muted);margin-bottom:8px;line-height:1.4}
.tc-info{font-size:9px;color:rgba(255,255,255,.3);font-family:'Unbounded',sans-serif}

/* ── Форма ── */
.ig{margin-bottom:10px}
.ig label{display:block;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.ig input{width:100%;padding:11px 13px;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1);border-radius:11px;color:var(--text);font-size:16px;font-family:'Manrope',sans-serif;outline:none;transition:border-color .2s}
.ig input:focus{border-color:var(--accent)}
.ig input::placeholder{color:rgba(255,255,255,.2)}
.rbox{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px;margin-bottom:16px}
.rtitle{font-weight:700;font-size:11px;margin-bottom:6px;color:var(--a2)}
.rules{list-style:none;display:flex;flex-direction:column;gap:5px}
.rules li{font-size:11px;color:rgba(255,255,255,.65);line-height:1.5}

/* ── Кнопки ── */
.btn{width:100%;padding:13px;border:none;border-radius:12px;font-size:13px;font-weight:700;font-family:'Manrope',sans-serif;cursor:pointer;transition:transform .15s,box-shadow .15s;margin-top:5px;letter-spacing:.02em}
.btn:active{transform:scale(.97)}
.btn-p{background:linear-gradient(135deg,var(--accent),var(--a2));color:#fff;box-shadow:0 8px 24px rgba(124,92,252,.35)}
.btn-p:hover{box-shadow:0 12px 32px rgba(124,92,252,.5);transform:translateY(-1px)}
.btn-alg{background:linear-gradient(135deg,#059669,var(--green));color:#fff;box-shadow:0 8px 24px rgba(16,185,129,.3)}
.btn-g{background:rgba(255,255,255,.06);color:var(--muted)}
.btn-g:hover{background:rgba(255,255,255,.1)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none!important}
.err{color:var(--red);font-size:11px;margin-top:-4px;margin-bottom:6px}

/* ── Тест ── */
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.qprog{font-size:11px;color:var(--muted);font-family:'Unbounded',sans-serif}
.timer{font-family:'Unbounded',sans-serif;font-size:15px;font-weight:700;color:var(--a2)}
.timer.urg{color:var(--red);animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.vbadge{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3);border-radius:100px;padding:2px 7px;font-size:10px;font-weight:700}
.bar{height:4px;background:rgba(255,255,255,.08);border-radius:100px;margin-bottom:12px;overflow:hidden}
.barf{height:100%;background:linear-gradient(90deg,var(--accent),var(--a2));border-radius:100px;transition:width .4s}
.ltag{display:inline-block;border-radius:100px;padding:2px 8px;font-size:9px;font-weight:700}
.l1{background:rgba(16,185,129,.15);color:#10b981}
.l2{background:rgba(245,158,11,.15);color:#f59e0b}
.l3{background:rgba(239,68,68,.15);color:#ef4444}
.stag{font-size:9px;color:rgba(255,255,255,.25);font-family:'Unbounded',sans-serif}
.qtext{font-size:clamp(14px,3.5vw,17px);font-weight:600;line-height:1.65;margin-bottom:11px}
.opts{display:flex;flex-direction:column;gap:7px;margin-bottom:11px}
/* ✅ Bug fix: тільки color transition, без transform — немає стрибка */
.opt{display:flex;align-items:flex-start;gap:9px;padding:13px 12px;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.08);border-radius:11px;font-size:13px;font-weight:500;color:var(--text);cursor:pointer;text-align:left;width:100%;font-family:'Manrope',sans-serif;line-height:1.5;transition:background .15s,border-color .15s}
.opt:hover:not([disabled]):not(.sel){background:rgba(124,92,252,.08);border-color:rgba(124,92,252,.25)}
.opt.sel{background:rgba(124,92,252,.15);border-color:var(--accent)}
.opt.ok{background:rgba(16,185,129,.15);border-color:var(--green)}
.opt.no{background:rgba(239,68,68,.15);border-color:var(--red)}
.ol{min-width:24px;height:24px;background:rgba(124,92,252,.2);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'Unbounded',sans-serif;font-size:9px;color:var(--a2);font-weight:700;flex-shrink:0;margin-top:1px;transition:background .15s,color .15s}
.opt.sel .ol{background:var(--accent);color:#fff}
.opt.ok  .ol{background:var(--green);color:#fff}
.opt.no  .ol{background:var(--red);color:#fff}
.hint{background:rgba(124,92,252,.1);border:1px solid rgba(124,92,252,.2);border-radius:9px;padding:9px 11px;font-size:12px;color:var(--a2);margin-top:7px;line-height:1.6;animation:su .25s ease}

/* ── Toast ── */
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#1e1b4b;border:1px solid rgba(124,92,252,.4);color:#fff;border-radius:12px;padding:11px 16px;z-index:9999;text-align:center;font-size:12px;font-weight:600;min-width:230px;box-shadow:0 8px 32px rgba(0,0,0,.5);display:none;animation:toastIn .3s ease}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
#toast.show{display:block}
.tsub{font-size:9px;color:var(--a2);margin-top:2px}

/* ── Результат ── */
.ricon{font-size:48px;text-align:center;margin-bottom:6px}
.rbig{font-family:'Unbounded',sans-serif;font-size:clamp(34px,8vw,50px);font-weight:900;text-align:center;margin:5px 0 3px;line-height:1}
.rlbl{font-weight:700;font-size:14px;text-align:center;margin-bottom:12px}
.repbox{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px;margin:11px 0}
.reptitle{font-weight:700;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:9px}
.repgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:7px}
.repitem{background:rgba(255,255,255,.04);border-radius:9px;padding:9px;text-align:center}
.repval{font-family:'Unbounded',sans-serif;font-size:18px;font-weight:900;display:block}
.replbl{font-size:9px;color:var(--muted);margin-top:2px;display:block}
.repst{font-size:11px;color:var(--muted);text-align:center;padding-top:7px;border-top:1px solid rgba(255,255,255,.06)}
.tspent{font-size:11px;color:var(--muted);text-align:center;margin-bottom:5px}
.sstatus{text-align:center;font-size:11px;font-weight:600;margin-top:7px;padding:7px;border-radius:9px}
.sstatus.sending{color:var(--muted)}
.sstatus.ok{color:var(--green);background:rgba(16,185,129,.1)}
.sstatus.fail{color:var(--yellow);background:rgba(245,158,11,.1)}

/* ── Вчитель ── */
.tab-row{display:flex;gap:6px;margin-bottom:14px}
.tab{flex:1;padding:9px;border:1.5px solid rgba(255,255,255,.08);border-radius:10px;background:rgba(255,255,255,.04);color:var(--muted);font-family:'Manrope',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;text-align:center}
.tab.active.geo{border-color:var(--accent);background:rgba(124,92,252,.15);color:var(--a2)}
.tab.active.alg{border-color:var(--green);background:rgba(16,185,129,.1);color:var(--green)}
.srow{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:14px}
.ms{background:rgba(255,255,255,.04);border-radius:9px;padding:7px 3px;text-align:center}
.msv{font-family:'Unbounded',sans-serif;font-size:14px;font-weight:900}
.msl{font-size:8px;color:var(--muted);margin-top:2px}
.rrow{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-left:4px solid var(--green);border-radius:11px;padding:10px 12px;margin-bottom:6px}
.rrow.warn{border-left-color:var(--yellow)}
.rrow.fail{border-left-color:var(--red)}
.rrtop{display:flex;justify-content:space-between;align-items:flex-start}
.rrn{font-weight:700;font-size:13px}
.rrt{font-size:9px;color:var(--muted);margin-top:2px}
.rrs{font-family:'Unbounded',sans-serif;font-size:13px;font-weight:900}
.rrg{font-size:9px;color:var(--muted);text-align:right;margin-top:2px}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.tag{border-radius:100px;padding:2px 7px;font-size:9px;font-weight:700}
.tok{background:rgba(16,185,129,.15);color:var(--green)}
.twarn{background:rgba(245,158,11,.15);color:var(--yellow)}
.tdng{background:rgba(239,68,68,.15);color:var(--red)}
.empty{text-align:center;color:var(--muted);padding:30px 0;font-size:13px}
.tbh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
svg text{-webkit-user-select:none;user-select:none}
</style>
</head>
<body>
<div id="toast"><span id="tm"></span><div class="tsub" id="ts"></div></div>
<div id="app"></div>
<script>
// ════════════════════════════════════════════
// ⚙️ КОНФІГУРАЦІЯ
// ════════════════════════════════════════════
const WEBHOOK = 'https://script.google.com/macros/s/AKfycby_IG60ogTeu85CAq4H1xyLFOd5Mg6tSkc0_zl8-C6x05fF7-m8moBoGs_Odc2pDRwE4A/exec';
const TEACHER_PASS = 'teacher2025';
const MAX_VIOL = 10;
const TIME_LIMIT = 45 * 60;

const TEST_CFG = {
  geo: { key:'geo', icon:'📐', title:'Геометрія', titleFull:'Контрольна з Геометрії',
         subject:'Геометрія', topic:'Геометричні перетворення', color:'var(--accent)', pick:[4,5,3] },
  alg: { key:'alg', icon:'🎲', title:'Алгебра',   titleFull:'Контрольна з Алгебри',
         subject:'Алгебра',   topic:'Комбінаторика, ймовірність, статистика', color:'var(--green)', pick:[3,5,4] },
};

// ════════════════════════════════════════════
// 🎨 SVG BUILDER
// ════════════════════════════════════════════
function mksvg(inner,w=220,h=200){
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg" style="display:block;max-width:100%;margin:8px auto;border-radius:9px;background:rgba(0,0,0,.28)">${inner}</svg>`;
}
function grd(cx,cy,sc,rng){let s='';for(let i=-rng;i<=rng;i++){s+=`<line x1="${cx+i*sc}" y1="${cy-rng*sc}" x2="${cx+i*sc}" y2="${cy+rng*sc}" stroke="rgba(255,255,255,.06)" stroke-width=".5"/>`;s+=`<line x1="${cx-rng*sc}" y1="${cy+i*sc}" x2="${cx+rng*sc}" y2="${cy+i*sc}" stroke="rgba(255,255,255,.06)" stroke-width=".5"/>`;} return s;}
function axs(cx,cy,sc,rng){const r=rng*sc;return `<line x1="${cx-r}" y1="${cy}" x2="${cx+r}" y2="${cy}" stroke="rgba(255,255,255,.42)" stroke-width="1.5"/><line x1="${cx}" y1="${cy-r}" x2="${cx}" y2="${cy+r}" stroke="rgba(255,255,255,.42)" stroke-width="1.5"/><polygon points="${cx+r},${cy} ${cx+r-7},${cy-3.5} ${cx+r-7},${cy+3.5}" fill="rgba(255,255,255,.42)"/><polygon points="${cx},${cy-r} ${cx-3.5},${cy-r+7} ${cx+3.5},${cy-r+7}" fill="rgba(255,255,255,.42)"/><text x="${cx+r+2}" y="${cy+11}" fill="rgba(255,255,255,.4)" font-size="11" font-family="Manrope">x</text><text x="${cx+4}" y="${cy-r+5}" fill="rgba(255,255,255,.4)" font-size="11" font-family="Manrope">y</text>`;}
function tks(cx,cy,sc,rng){let s='';for(let i=-rng+1;i<=rng-1;i++){if(i===0)continue;s+=`<text x="${cx+i*sc-4}" y="${cy+13}" fill="rgba(255,255,255,.2)" font-size="8" font-family="Manrope">${i}</text>`;s+=`<text x="${cx-13}" y="${cy-i*sc+4}" fill="rgba(255,255,255,.2)" font-size="8" font-family="Manrope">${i}</text>`;}return s;}
function cp(cx,cy,sc,rng,extra){return mksvg(grd(cx,cy,sc,rng)+axs(cx,cy,sc,rng)+tks(cx,cy,sc,rng)+extra,220,220);}
function dot(cx,cy,sc,x,y,col,lbl,lp){const px=cx+x*sc,py=cy-y*sc;const off={tr:[7,-6],tl:[-34,-6],br:[7,13],bl:[-34,13]};const[ox,oy]=off[lp||'tr'];return `<circle cx="${px}" cy="${py}" r="5" fill="${col}"/><text x="${px+ox}" y="${py+oy}" fill="${col}" font-size="11" font-family="Manrope" font-weight="bold">${lbl}</text>`;}
function seg(cx,cy,sc,x1,y1,x2,y2,col,dash){const d=dash?'stroke-dasharray="5,3"':'';return `<line x1="${cx+x1*sc}" y1="${cy-y1*sc}" x2="${cx+x2*sc}" y2="${cy-y2*sc}" stroke="${col}" stroke-width="1.5" ${d}/>`;}
function tri(cx,cy,sc,pts,str,fil){return `<polygon points="${pts.map(([x,y])=>`${cx+x*sc},${cy-y*sc}`).join(' ')}" stroke="${str}" stroke-width="2" fill="${fil}"/>`;}

// ════════════════════════════════════════════
// 📐 SVG ДЛЯ ГЕОМЕТРІЇ
// ════════════════════════════════════════════
const CX=110,CY=110,SC=18;
const GEO_E2 = cp(CX,CY,SC,5,seg(CX,CY,SC,-3,-2,3,2,'rgba(255,255,255,.13)',true)+dot(CX,CY,SC,0,0,'#f59e0b','O','br')+dot(CX,CY,SC,3,2,'#a78bfa','A(3;2)','tr')+dot(CX,CY,SC,-3,-2,'#10b981','A\'(?)','bl'));
const GEO_E5 = cp(CX,CY,SC,5,seg(CX,CY,SC,4,-3,4,3,'rgba(255,255,255,.13)',true)+dot(CX,CY,SC,4,-3,'#a78bfa','B(4;−3)','tr')+dot(CX,CY,SC,4,3,'#10b981','B\'(?)','br'));
const GEO_E9 = cp(CX,CY,SC,5,`<defs><marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#10b981"/></marker></defs><line x1="${CX+SC}" y1="${CY-SC}" x2="${CX+3*SC-2}" y2="${CY-4*SC+2}" stroke="#10b981" stroke-width="1.5" marker-end="url(#a1)"/>`+dot(CX,CY,SC,1,1,'#a78bfa','C(1;1)','bl')+dot(CX,CY,SC,3,4,'#10b981','C\'(3;4)','tr'));
const GEO_M1 = (()=>{const sc2=16,cy2=120;return mksvg(grd(CX,cy2,sc2,6)+axs(CX,cy2,sc2,6)+tks(CX,cy2,sc2,6)+tri(CX,cy2,sc2,[[0,0],[4,0],[0,3]],'#a78bfa','rgba(124,92,252,.15)')+tri(CX,cy2,sc2,[[0,0],[-4,0],[0,3]],'#10b981','rgba(16,185,129,.15)')+dot(CX,cy2,sc2,0,0,'rgba(255,255,255,.4)','A','br')+dot(CX,cy2,sc2,4,0,'#a78bfa','B(4;0)','tr')+dot(CX,cy2,sc2,0,3,'#a78bfa','C(0;3)','tl')+dot(CX,cy2,sc2,-4,0,'#10b981','B\'(?)','tl'),220,220);})();
const GEO_M3 = (()=>{const sc3=15;return mksvg(grd(CX,CY,sc3,6)+axs(CX,CY,sc3,6)+tks(CX,CY,sc3,6)+seg(CX,CY,sc3,0,0,2,5,'rgba(167,139,250,.3)')+seg(CX,CY,sc3,0,0,5,-2,'rgba(16,185,129,.3)')+`<path d="M ${CX+sc3*2} ${CY} A ${sc3*2} ${sc3*2} 0 0 0 ${CX} ${CY-sc3*2}" stroke="rgba(245,158,11,.4)" stroke-width="1.2" fill="none" stroke-dasharray="3,2"/>`+dot(CX,CY,sc3,0,0,'#f59e0b','O','bl')+dot(CX,CY,sc3,2,5,'#a78bfa','M(2;5)','tr')+dot(CX,CY,sc3,5,-2,'#10b981','M\'(?)','br'),220,220);})();
const GEO_M4 = cp(CX,CY,SC,5,`<defs><marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#10b981"/></marker></defs><line x1="${CX+SC}" y1="${CY-2*SC}" x2="${CX-2*SC+2}" y2="${CY-5*SC+2}" stroke="#10b981" stroke-width="1.5" marker-end="url(#a2)"/>`+dot(CX,CY,SC,1,2,'#a78bfa','A(1;2)','tr')+dot(CX,CY,SC,-2,6,'#10b981','A\'(?)','tl'));
const GEO_M6 = cp(CX,CY,SC,5,`<line x1="${CX-5*SC}" y1="${CY+5*SC}" x2="${CX+5*SC}" y2="${CY-5*SC}" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3"/><text x="${CX+2.8*SC}" y="${CY-3.2*SC}" fill="#f59e0b" font-size="10" font-family="Manrope">y=x</text>`+seg(CX,CY,SC,3,1,1,3,'rgba(255,255,255,.13)',true)+dot(CX,CY,SC,3,1,'#a78bfa','P(3;1)','tr')+dot(CX,CY,SC,1,3,'#10b981','P\'(?)','tl'));

const ALG_BAR = (()=>{
  const grades=[7,8,9,10,11,12],counts=[3,5,8,4,6,2];
  const W=260,H=170,pL=32,pB=30,pT=14,pR=10,cW=W-pL-pR,cH=H-pB-pT,maxV=8,bW=26;
  const gap=(cW-grades.length*bW)/(grades.length+1);
  let s='';
  for(let v=0;v<=8;v+=2){const y=pT+cH-v*(cH/maxV);s+=`<line x1="${pL}" y1="${y}" x2="${W-pR}" y2="${y}" stroke="rgba(255,255,255,.07)" stroke-width=".5"/><text x="${pL-4}" y="${y+4}" fill="rgba(255,255,255,.28)" font-size="8" font-family="Manrope" text-anchor="end">${v}</text>`;}
  s+=`<line x1="${pL}" y1="${pT}" x2="${pL}" y2="${pT+cH}" stroke="rgba(255,255,255,.3)" stroke-width="1.2"/><line x1="${pL}" y1="${pT+cH}" x2="${W-pR}" y2="${pT+cH}" stroke="rgba(255,255,255,.3)" stroke-width="1.2"/>`;
  s+=`<text x="${W/2}" y="${H-2}" fill="rgba(255,255,255,.35)" font-size="9" font-family="Manrope" text-anchor="middle">Оцінка</text>`;
  grades.forEach((g,i)=>{const x=pL+gap+(bW+gap)*i,bH=counts[i]*(cH/maxV),y=pT+cH-bH,hl=i===3;s+=`<rect x="${x}" y="${y}" width="${bW}" height="${bH}" rx="3" fill="${hl?'#f59e0b':'#a78bfa'}" opacity="${hl?1:.7}"/><text x="${x+bW/2}" y="${pT+cH+13}" fill="rgba(255,255,255,.5)" font-size="9" font-family="Manrope" text-anchor="middle">${g}</text>`;s+=hl?`<text x="${x+bW/2}" y="${y-4}" fill="#f59e0b" font-size="9" font-family="Manrope" text-anchor="middle" font-weight="bold">?</text>`:`<text x="${x+bW/2}" y="${y-4}" fill="rgba(255,255,255,.35)" font-size="8" font-family="Manrope" text-anchor="middle">${counts[i]}</text>`;});
  return mksvg(s,W,H);
})();

const ALG_PIE = (()=>{
  const cx=88,cy=80,r=60;
  const sectors=[['Автобус',108,'#a78bfa'],['Авто',90,'#10b981'],['Пішки',72,'#f59e0b'],['Велосипед',54,'#22d3ee'],['Інше',36,'#f87171']];
  function pxy(deg){const rad=(deg-90)*Math.PI/180;return[cx+r*Math.cos(rad),cy+r*Math.sin(rad)];}
  let s='',cum=0;
  sectors.forEach(([name,ang,col])=>{const[x1,y1]=pxy(cum);cum+=ang;const[x2,y2]=pxy(cum);const lg=ang>180?1:0;s+=`<path d="M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${lg},1 ${x2.toFixed(1)},${y2.toFixed(1)} Z" fill="${col}" opacity=".85" stroke="#1a1a2e" stroke-width="1.5"/>`;const mid=cum-ang/2,lr=r*0.62,lrad=(mid-90)*Math.PI/180;if(ang>=54)s+=`<text x="${(cx+lr*Math.cos(lrad)).toFixed(1)}" y="${(cy+lr*Math.sin(lrad)+4).toFixed(1)}" fill="rgba(0,0,0,.8)" font-size="8" font-family="Manrope" text-anchor="middle" font-weight="bold">${Math.round(ang/360*100)}%</text>`;});
  sectors.forEach(([name,ang,col],i)=>{const ly=16+i*26;s+=`<rect x="188" y="${ly}" width="9" height="9" rx="2" fill="${col}"/><text x="201" y="${ly+8}" fill="rgba(255,255,255,.65)" font-size="8" font-family="Manrope">${name}</text>`;});
  s+=`<text x="${cx}" y="${cy+r+15}" fill="#a78bfa" font-size="9" font-family="Manrope" text-anchor="middle" font-weight="bold">↑ Автобус: кут=108°</text>`;
  return mksvg(s,285,175);
})();

function shuffle(a){return[...a].sort(()=>Math.random()-.5)}
function selectQ(testKey){
  const cfg=TEST_CFG[testKey], pool=testKey==='geo'?POOL_GEO:POOL_ALG;
  const[ne,nm,nh]=cfg.pick;
  return shuffle([
    ...shuffle(pool.easy).slice(0,ne),
    ...shuffle(pool.medium).slice(0,nm),
    ...shuffle(pool.hard).slice(0,nh),
  ]).map(q=>({...q,opts:shuffle(q.opts.map((o,i)=>({t:o,ok:i===q.correct})))}));
}

// ✅ ВИПРАВЛЕННЯ 2: час у вигляді "Xхв Yс"
function fmtTime(sec){const m=Math.floor(sec/60),s=sec%60;return m>0?`${m}хв ${s}с`:`${s}с`;}
function gradeInfo(p){
  if(p>=92)return{l:'12',c:'#a78bfa'};
  if(p>=75)return{l:'10–11',c:'#10b981'};
  if(p>=58)return{l:'7–9',c:'#22d3ee'};
  if(p>=42)return{l:'5–6',c:'#f59e0b'};
  return{l:'1–4',c:'#ef4444'};
}
function toast(msg,sub='',dur=3000){
  $('tm').textContent=msg;$('ts').textContent=sub;
  const t=$('toast');t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),dur);
}
async function sendToSheets(data){
  return new Promise(res=>{
    try{const p=new URLSearchParams({data:JSON.stringify(data)});const img=new Image();img.onload=()=>res(true);img.onerror=()=>res(true);img.src=WEBHOOK+'?'+p.toString();setTimeout(()=>res(true),8000);}catch{res(false)}
  });
}

let _L=[];
function addL(t,e,fn){t.addEventListener(e,fn);_L.push({t,e,fn})}
function removeL(){_L.forEach(({t,e,fn})=>t.removeEventListener(e,fn));_L=[]}
function setupAC(){
  addL(document,'visibilitychange',()=>{if(document.hidden&&S.phase==='quiz')viol('tab','🚨 Вихід з тесту зафіксовано!')});
  addL(window,'blur',()=>{if(S.phase==='quiz')viol('blur','🚨 Перемикання програми зафіксовано!')});
  addL(document,'fullscreenchange',onFsChg);addL(document,'webkitfullscreenchange',onFsChg);
  history.pushState(null,'',location.href);
  addL(window,'popstate',()=>{history.pushState(null,'',location.href);if(S.phase==='quiz')viol('nav','🚨 Кнопка "Назад" заблокована!');});
  addL(document,'keydown',e=>{
    if(S.phase!=='quiz')return;
    if((e.ctrlKey||e.metaKey)&&'cvuspa'.includes(e.key.toLowerCase()))e.preventDefault();
    if(e.key==='PrintScreen'){e.preventDefault();viol('ss','🚨 Спроба скріншоту!')}
    if(e.metaKey&&e.shiftKey&&['3','4','5','s'].includes(e.key)){e.preventDefault();viol('ss','🚨 Спроба скріншоту!')}
  });
  addL(document,'contextmenu',e=>e.preventDefault());
  document.body.style.userSelect='none';document.body.style.webkitUserSelect='none';
  if(navigator.mediaDevices&&navigator.mediaDevices.getDisplayMedia)
    navigator.mediaDevices.getDisplayMedia=async()=>{viol('ss','🚨 Захоплення екрану заблоковано!');throw new Error('blocked')};
}
function onFsChg(){const isFs=!!(document.fullscreenElement||document.webkitFullscreenElement);if(!isFs&&S.phase==='quiz'){viol('fs','🚨 Вихід з повноекранного режиму!');setTimeout(reqFs,600)}}
function reqFs(){const el=document.documentElement;try{if(el.requestFullscreen)el.requestFullscreen();else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen()}catch{}}
function viol(type,msg){
  if(S.phase!=='quiz')return;
  S.v[type]=(S.v[type]||0)+1;S.v.total++;
  const left=MAX_VIOL-S.v.total;
  toast(msg,left>0?`Попереджень залишилось: ${left}`:'Тест буде завершено!');
  const vb=document.getElementById('vbadge');
  if(vb){vb.textContent=`⚠️ ${S.v.total}/${MAX_VIOL}`;vb.style.display='inline'}
  if(S.v.total>=MAX_VIOL)finish(true);
}

function getLevel(q,testKey){
  const pool=testKey==='geo'?POOL_GEO:POOL_ALG;
  if(pool.easy.find(x=>x.q===q.q))return'easy';
  if(pool.medium.find(x=>x.q===q.q))return'medium';
  return'hard';
}
const lvlCls={easy:'l1',medium:'l2',hard:'l3'};
const lvlLbl={easy:'Базовий',medium:'Середній',hard:'Достатній'};

function renderQ(){
  const q=S.questions[S.cur];
  const pct=Math.round(S.cur/S.questions.length*100);

  const lv=getLevel(q,S.testKey);

    <div class="qhead">
      <span class="qprog">${S.cur+1} / ${S.questions.length}</span>

      </div>

    <div class="opts" id="opts-wrap">

        <span class="ol">${String.fromCharCode(65+i)}</span><span>${o.t}</span>
      </button>`).join('')}
    </div>
    <button class="btn ${S.testKey==='geo'?'btn-p':'btn-alg'}" id="confirm-btn" onclick="confirmAns()" ${S.sel===null||S.conf?'disabled':''}>
      ${S.conf?'✓ Зараховано — переходимо далі...':'Підтвердити відповідь →'}
    </button>
    ${S.conf?`<div class="hint">💡 ${q.hint}</div>`:''}
  </div>`;
}

// ✅ ВИПРАВЛЕННЯ 3: тільки DOM-маніпуляція — без перерендеру → немає стрибків
function selOpt(i){
  if(S.conf)return;
  S.sel=i;
  document.querySelectorAll('#opts-wrap .opt').forEach((btn,idx)=>{
    const active=idx===i;
    btn.classList.toggle('sel',active);
    const ol=btn.querySelector('.ol');
    ol.style.background=active?'var(--accent)':'rgba(124,92,252,.2)';
    ol.style.color=active?'#fff':'var(--a2)';
  });
  const cb=$('confirm-btn');
  if(cb)cb.disabled=false;
}

function confirmAns(){
  if(S.sel===null||S.conf)return;
  const q=S.questions[S.cur];
  const correct=q.opts[S.sel].ok;
  if(correct)S.score++;
  S.conf=true;
  document.querySelectorAll('#opts-wrap .opt').forEach((btn,idx)=>{
    btn.disabled=true;
    const ol=btn.querySelector('.ol');
    if(q.opts[idx].ok){btn.classList.add('ok');ol.style.cssText='background:var(--green);color:#fff'}
    else if(idx===S.sel&&!correct){btn.classList.add('no');ol.style.cssText='background:var(--red);color:#fff'}
  });
  const cb=$('confirm-btn');if(cb)cb.textContent='✓ Зараховано — переходимо далі...';
  const wrap=$('opts-wrap');
  if(wrap){const h=document.createElement('div');h.className='hint';h.textContent='💡 '+q.hint;wrap.after(h);}
  setTimeout(()=>{
    if(S.cur+1>=S.questions.length)finish(false);
    else{S.cur++;S.sel=null;S.conf=false;renderQ()}
  },1600);
}

// ════════════════════════════════════════════
// 🏁 ЗАВЕРШЕННЯ
// ════════════════════════════════════════════
async function finish(terminated){
  if(S.done)return;S.done=true;S.phase='result';
  clearInterval(S.tInt);removeL();
  const elapsed=Math.round((Date.now()-S.start)/1000);
  const pct=Math.round(S.score/S.questions.length*100);
  const g=gradeInfo(pct);
  const cfg=TEST_CFG[S.testKey];
  // ✅ ВИПРАВЛЕННЯ 1: "з" замість "/" — Google Sheets не перетворює на дату
  const data={
    subject:cfg.subject,
    name:S.name,
    score:`${S.score} з ${S.questions.length}`,
    percent:pct,grade:g.l,
    violations:S.v.total,terminated,
    timeSpent:fmtTime(elapsed),
    timestamp:nowStr()
  };
  // Локальне збереження
  try{const k=`kr9-${S.testKey}`;const ex=JSON.parse(localStorage.getItem(k)||'[]');ex.push(data);localStorage.setItem(k,JSON.stringify(ex))}catch{}
  renderResult(data,terminated,g,'sending');
  const ok=await sendToSheets(data);
  const st=$('send-st');
  if(st){st.className='sstatus '+(ok?'ok':'fail');st.textContent=ok?'✅ Результат записано в Google Таблицю!':'⚠️ Збережено локально. Перевір інтернет.'}
}

// ════════════════════════════════════════════
// 🏆 РЕЗУЛЬТАТ
// ════════════════════════════════════════════
function renderResult(data,terminated,g,ss){
  const vt=data.violations||0;
  const icon=terminated?'🚫':data.percent>=92?'🏆':data.percent>=75?'🎉':data.percent>=42?'📖':'💪';
  const tot=S.questions?S.questions.length:12;
  const cfg=TEST_CFG[S.testKey||'geo'];
  app.innerHTML=`
  <div class="card">
    <div class="ricon">${icon}</div>
    <h2 style="text-align:center">${terminated?'Тест завершено достроково':cfg.titleFull+' завершена'}</h2>
    <div style="text-align:center;margin:4px 0 10px"><span class="badge">${cfg.icon} ${cfg.subject}</span></div>
    ${terminated?`<p class="err" style="text-align:center;margin:4px 0">Завершено через ${MAX_VIOL} порушень</p>`:''}
    <div class="rbig" style="color:${g.c}">${S.score}<span style="font-size:.4em;opacity:.55"> з ${tot}</span></div>
    <div class="rlbl" style="color:${g.c}">Орієнтовна оцінка: ${g.l}</div>
    <div class="bar"><div class="barf" style="width:${data.percent}%;background:${terminated?'var(--red)':g.c}"></div></div>
    <div class="repbox">
      <div class="reptitle">📊 Звіт</div>
      <div class="repgrid">
        <div class="repitem"><span class="repval" style="color:${g.c}">${data.percent}%</span><span class="replbl">Результат</span></div>
        <div class="repitem"><span class="repval" style="color:${vt>0?'var(--red)':'var(--green)'}">${vt}</span><span class="replbl">Порушень</span></div>
      </div>
      <div class="tspent">⏱ Витрачено: ${data.timeSpent}</div>
      <div class="repst">${terminated?'🔴 Завершено через порушення':vt===0?'🟢 Порушень не виявлено':`🟡 ${vt} підозрілих дій`}</div>
    </div>
    <div class="sstatus sending" id="send-st">⏳ Відправляємо результат...</div>
    <button class="btn btn-g" style="margin-top:10px;font-size:12px" onclick="renderHome()">← На початок</button>
  </div>`;
}

// ════════════════════════════════════════════
// 🔐 ВХІД ВЧИТЕЛЯ
// ════════════════════════════════════════════
function renderTLogin(){
  app.innerHTML=`
  <div class="card">
    <div class="badge">🔐 Панель вчителя</div>
    <h2>Вхід</h2>
    <p class="sub">Введи пароль для перегляду результатів</p>
    <div class="ig"><label>Пароль</label><input id="tp" type="password" placeholder="••••••••" autocomplete="off"/></div>
    <p class="err" id="te" style="display:none">Невірний пароль</p>
    <button class="btn btn-p" onclick="checkPass()">Увійти →</button>
    <button class="btn btn-g" style="margin-top:5px" onclick="renderHome()">← Назад</button>
  </div>`;
  $('tp').addEventListener('keydown',e=>e.key==='Enter'&&checkPass());
}
function checkPass(){if($('tp').value===TEACHER_PASS)renderTeacher('geo');else $('te').style.display='block'}

// ════════════════════════════════════════════
// 📊 ПАНЕЛЬ ВЧИТЕЛЯ (два списки)
// ════════════════════════════════════════════
let _allResults=[];

async function renderTeacher(tab){
  tab=tab||'geo';
  app.innerHTML=`<div class="card" style="text-align:center;padding:50px 20px"><div style="font-size:36px;margin-bottom:12px">⏳</div><p style="color:var(--muted);font-size:13px">Завантажуємо результати...</p></div>`;
  // Завантажуємо з Google Sheets (усі)
  let allRes=[],source='sheets';
  try{
    const resp=await fetch(WEBHOOK+'?action=list');
    const json=await resp.json();
    if(json.success&&Array.isArray(json.results)) allRes=json.results;
  }catch{
    source='local';
    const g=JSON.parse(localStorage.getItem('kr9-geo')||'[]');
    const a=JSON.parse(localStorage.getItem('kr9-alg')||'[]');
    allRes=[...g,...a];
  }
  _allResults=allRes;
  renderTeacherTab(tab,allRes,source);
}

function renderTeacherTab(tab,allRes,source){
  // Фільтруємо за предметом
  const subjectMap={geo:'Геометрія',alg:'Алгебра'};
  const res=allRes.filter(r=>(r.subject||'').includes(subjectMap[tab]||''));
  const tot=res.length,avg=tot?Math.round(res.reduce((s,r)=>s+(r.percent||0),0)/tot):0;
  const terms=res.filter(r=>r.terminated).length,viols=res.filter(r=>(r.violations||0)>0).length;
  const sorted=[...res].sort((a,b)=>(b.percent||0)-(a.percent||0));
  const srcLabel=source==='sheets'
    ?`<span style="font-size:10px;color:var(--green)">🟢 Google Sheets</span>`
    :`<span style="font-size:10px;color:var(--yellow)">🟡 Локальні дані</span>`;
  const geoActive=tab==='geo';

  app.innerHTML=`
  <div class="card" style="max-width:580px">
    <div class="tbh">
      <div><div class="badge">🔐 Вчитель</div><h2 style="margin-top:4px">Результати</h2>${srcLabel}</div>
      <div style="display:flex;gap:5px">
        <button class="btn btn-g" style="width:auto;padding:7px 9px;font-size:15px;margin-top:0" onclick="renderTeacher('${tab}')">🔄</button>
        <button class="btn btn-g" style="width:auto;padding:7px 10px;font-size:11px;margin-top:0" onclick="renderHome()">← Вийти</button>
      </div>
    </div>
    <!-- ТАБИ -->
    <div class="tab-row">
      <button class="tab geo ${geoActive?'active':''}" onclick="switchTab('geo')">📐 Геометрія</button>
      <button class="tab alg ${!geoActive?'active':''}" onclick="switchTab('alg')">🎲 Алгебра</button>
    </div>
    <!-- СТАТИСТИКА -->
    ${tot>0?`<div class="srow">
      <div class="ms"><div class="msv">${tot}</div><div class="msl">Здали</div></div>
      <div class="ms"><div class="msv">${avg}%</div><div class="msl">Середній %</div></div>
      <div class="ms"><div class="msv">${terms}</div><div class="msl">Дострокових</div></div>
      <div class="ms"><div class="msv">${viols}</div><div class="msl">З порушеннями</div></div>
    </div>`:''}
    <!-- СПИСОК -->
    <div id="results-list">
      ${tot===0
        ?`<div class="empty">📭 Поки немає результатів з ${geoActive?'геометрії':'алгебри'}</div>`
        :sorted.map(r=>{
          const g=gradeInfo(r.percent||0),vt=r.violations||0;
          return`<div class="rrow ${r.terminated?'fail':vt>0?'warn':''}">
            <div class="rrtop">
              <div><div class="rrn">${r.name}</div><div class="rrt">${r.timestamp||''}</div></div>
              <div><div class="rrs" style="color:${g.c}">${r.score} (${r.percent}%)</div><div class="rrg">~${g.l}</div></div>
            </div>
            <div class="tags">
              ${r.terminated?`<span class="tag tdng">🚫 Дострокове</span>`:''}
              ${vt>0&&!r.terminated?`<span class="tag twarn">⚠️ ${vt} порушень</span>`:''}
              ${vt===0?`<span class="tag tok">✅ Чисто</span>`:''}
              ${r.timeSpent?`<span class="tag" style="background:rgba(255,255,255,.05);color:var(--muted)">⏱ ${r.timeSpent}</span>`:''}
            </div>
          </div>`;
        }).join('')}
    </div>
    ${tot>0?`<button class="btn btn-p" id="cbtn" style="margin-top:10px" onclick="copySheets('${tab}')">📋 Скопіювати для Google Sheets</button>`:''}
  </div>`;
  window._currentTab=tab;window._currentSource=source;
}

function switchTab(tab){
  renderTeacherTab(tab,_allResults,window._currentSource||'sheets');
}

function copySheets(tab){
  const subjectMap={geo:'Геометрія',alg:'Алгебра'};
  const res=_allResults.filter(r=>(r.subject||'').includes(subjectMap[tab]||''));
  const h="Предмет\tПрізвище та ім'я\tБал\t%\tОцінка\tПорушень\tДострокове\tЧас\tДата";
  const rows=[...res].sort((a,b)=>(a.name||'').localeCompare(b.name||''))
    .map(r=>`${r.subject||''}\t${r.name}\t${r.score}\t${r.percent}%\t${r.grade}\t${r.violations}\t${r.terminated?'Так':'Ні'}\t${r.timeSpent||''}\t${r.timestamp||''}`)
    .join('\n');
  navigator.clipboard.writeText(h+'\n'+rows).then(()=>{
    const b=$('cbtn');if(b){b.textContent='✅ Скопійовано!';b.style.background='rgba(16,185,129,.15)';b.style.color='var(--green)'}
  }).catch(()=>alert('Спробуй на ПК'));
}

// ════════════════════════════════════════════
// 🚀 СТАРТ
// ════════════════════════════════════════════
renderHome();
</script>
</body>
</html>
